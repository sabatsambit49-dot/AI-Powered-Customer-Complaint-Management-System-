version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pharma_qms_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pharma_complaints
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pharma_qms_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/pharma_complaints
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PRIMARY_MODEL=llama-3.1-8b-instant
      - REASONING_MODEL=llama-3.3-70b-versatile
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
